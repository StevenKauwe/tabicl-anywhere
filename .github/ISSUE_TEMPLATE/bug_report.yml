name: Bug report
description: Something gives a wrong answer, an error it should not, or a crash
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste error messages as text.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to make it happen again
      description: The commands you ran (or the page and the steps), and a small table if you can share one. Please leave out private data.
      placeholder: |
        browsertabicl fit classifier-v2.tirs train.csv --target grade model.tirs
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Command line, Rust library, Web page, Node / WebAssembly, Graphics card (--features gpu), Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0, or the commit hash
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system, and the browser or graphics card if it matters
      placeholder: Windows 11, Chrome 141, RTX 3090
