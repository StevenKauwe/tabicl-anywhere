[package]
name = "browsertabicl-wasm"
version = "0.1.0"
edition = "2021"
description = "JavaScript bindings for BrowserTabICL (the generated glue needs unsafe code, so it lives apart from the safe core)"
license = "BSD-3-Clause"

[lib]
crate-type = ["cdylib"]

[dependencies]
browsertabicl = { path = ".." }
wasm-bindgen = "0.2"
